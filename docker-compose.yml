name: sprintdesk

services:

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: sprintdesk-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sprintdesk
      MYSQL_USER: sprintdesk
      MYSQL_PASSWORD: sprintdesk123

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

    networks:
      - sprintdesk-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10


  # Backend API
  backend:
    build: ./backend
    image: sprintdesk-backend:latest
    container_name: sprintdesk-backend
    restart: unless-stopped

    ports:
      - "5761:5761"

    environment:
      NODE_ENV: production
      PORT: 5761

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sprintdesk
      DB_USER: sprintdesk
      DB_PASSWORD: sprintdesk123

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - sprintdesk-network


  # Frontend Application
  frontend:
    build: ./frontend
    image: sprintdesk-frontend:latest
    container_name: sprintdesk-frontend
    restart: unless-stopped

    ports:
      - "8092:80"

    depends_on:
      - backend

    networks:
      - sprintdesk-network


# Docker Network
networks:
  sprintdesk-network:
    driver: bridge


# Database Storage
volumes:
  mysql_data:
